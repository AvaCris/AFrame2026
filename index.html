<!DOCTYPE html> 
 
<html> 
 
<head> 
 
  <meta charset="utf-8"> 
 
  <title>My A-Frame World</title> 
 
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
  
<script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

 
</head> 
 
<body> 

  <a-asset>
<img
id="neon"
src="Images2/Mural.jpg">

  </a-asset>
 
  <a-scene> 
 
    <a-box 
      position="0 1 -3" 
      color= "#00ff18> 
      src="#neon"</a-box>
    </a-box> 
 
    <a-plane 
      position="0 0 -4" 
      rotation="-90 0 0" 
      width="10" 
      height="10" 
      color="#ff6a00"> 
    </a-plane> 
 
    <a-sky color="#241b2f"></a-sky> 

    <a-entity environment="
    active: true;
    preset: dream;
     dressingColor: #de58e0; 
     ground: spikes;
     groundTexture: walkernoise;
     groundColor: #bfd8ff;
     dressing: pyramids;
     "></a-entity>


 
  </a-scene> 
 
</body> 
 
</html>
